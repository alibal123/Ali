name: Yorum izni testi

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Yorumları say (içerik yazdırılmaz)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          T = os.environ["IG_TOKEN"]; API = "https://graph.instagram.com/v21.0"
          def get(path, **p):
              p["access_token"] = T
              try:
                  with urllib.request.urlopen(f"{API}/{path}?" + urllib.parse.urlencode(p), timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  return {"error": e.read().decode()[:300]}
          media = get("me/media", fields="id,comments_count,timestamp", limit="10").get("data", [])
          total = 0
          for m in media:
              c = get(f"{m['id']}/comments", fields="id,timestamp", limit="50")
              if "error" in c:
                  print("YORUM OKUMA HATASI:", c["error"]); break
              total += len(c.get("data", []))
              print(m["timestamp"][:10], "comments_count:", m.get("comments_count"), "okunan:", len(c.get("data", [])))
          print("TOPLAM okunan yorum:", total)
          PY
