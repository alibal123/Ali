name: Video kliplerini indir

# assets/clips/request.json içindeki {ad: url} listesini indirir ve assets/clips/<ad>.mp4 olarak kaydeder.
on:
  workflow_dispatch:
  push:
    paths: ["assets/clips/request.json"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: İndir
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          req = json.load(open("assets/clips/request.json"))
          for name, url in req.items():
              out = f"assets/clips/{name}.mp4"
              if os.path.exists(out):
                  continue
              try:
                  r = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  open(out, "wb").write(urllib.request.urlopen(r, timeout=120).read())
                  print("indirildi:", name, os.path.getsize(out))
              except Exception as e:
                  print("::warning::indirilemedi", name, e)
          PY
      - name: Kaydet
        run: |
          git config user.name "derecefilm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets/clips
          git diff --cached --quiet || (git commit -m "Video klipleri indirildi" && git pull --rebase && git push)
