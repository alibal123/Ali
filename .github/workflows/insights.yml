name: Hesap verilerini topla

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # her gün 07:17 İstanbul (haber ve haftalık içerik görevlerinden önce)

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verileri çek
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/insights.py
      - name: Analiz et (format ağırlıkları)
        run: python3 scripts/analyze.py
      - name: Kaydet
        run: |
          git config user.name "derecefilm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add insights/media.json insights/strategy.json insights/RAPOR.md
          git diff --cached --quiet || (git commit -m "Hesap verileri güncellendi" && git pull --rebase && git push)
