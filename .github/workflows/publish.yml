name: Zamanı gelen gönderileri paylaş

on:
  schedule:
    - cron: "*/15 * * * *"   # her 15 dakikada bir kontrol (yedek)
    - cron: "33 16 * * *"    # 19:33 İstanbul: erken uyan, 20:00 gönderisini tam saatinde paylaş
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece dene, paylaşma (1 = evet)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # tetiklendiği andaki eski hali değil, deponun EN GÜNCEL halini oku
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paylaş
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python scripts/publish.py
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "derecefilm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedule.json
          git diff --cached --quiet || (git commit -m "Paylaşım durumu güncellendi" && git pull --rebase && git push)
