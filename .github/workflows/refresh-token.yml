name: Instagram anahtarını yenile

# Instagram uzun ömürlü anahtarı 60 günde biter. Bu iş her pazartesi yeniler.
# Gerekli gizli değişken: GH_PAT (bu repoda "Secrets: read and write" yetkili ince ayarlı GitHub anahtarı)
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Yenile ve kaydet
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_TOKEN}" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$NEW"
          gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW"
          echo "Anahtar yenilendi."
