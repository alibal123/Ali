<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok yetkilendirme</title>
<body style="font-family:sans-serif;max-width:640px;margin:40px auto;padding:0 16px">
<h1>Yetkilendirme tamamlandı</h1>
<p>Aşağıdaki kodu kopyalayıp <code>python tools/tiktok_auth.py kod "KOD"</code> komutuna yapıştır. Bu kod yalnızca tarayıcında gösterilir, hiçbir yere gönderilmez.</p>
<pre id="k" style="white-space:pre-wrap;word-break:break-all;background:#eee;padding:12px"></pre>
<script>var p=new URLSearchParams(location.search);document.getElementById('k').textContent=p.get('code')||('Kod yok. '+(p.get('error_description')||''));</script>
</body></html>
